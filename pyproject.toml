[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lilguy"
version = "0.1.0"
description = "Small-model shell scaffold and Linux sandbox foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2", "PyYAML>=6,<7", "bashlex>=0.18,<1"]

[project.optional-dependencies]
data = ["datasets>=3", "pyarrow>=18"]
train = []
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9", "build>=1.2"]

[project.scripts]
lilguy = "lilguy.cli:main"

[tool.setuptools.packages.find]
include = ["lilguy*"]

[tool.setuptools.package-data]
lilguy = ["grammar.gbnf", "data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"
markers = ["sandbox: requires the real sandbox capability probe to pass"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
