[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lilguy"
version = "2.0.0"
description = "A small local model for everyday file tasks, run in a reviewed Linux sandbox"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2", "PyYAML>=6,<7", "bashlex>=0.18,<1"]

[project.optional-dependencies]
data = ["datasets>=3", "pyarrow>=18"]
train = []
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/4-R-C-4-N-4/lilguy"
Model = "https://huggingface.co/4rc4n4/lilguy-minicpm5-2b-GGUF"
Changelog = "https://github.com/4-R-C-4-N-4/lilguy/blob/main/CHANGELOG.md"

[project.scripts]
lilguy = "lilguy.cli:main"

[tool.setuptools.packages.find]
include = ["lilguy*"]

[tool.setuptools.package-data]
lilguy = ["data/*.jsonl", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"
markers = ["sandbox: requires the real sandbox capability probe to pass"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
